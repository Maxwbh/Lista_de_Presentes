<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;">
        <tr><td style="background:#2D5016;color:#ffffff;padding:20px 24px;font-size:20px;font-weight:bold;">🎄 Lista de Presentes</td></tr>
        <tr><td style="padding:24px;font-size:15px;line-height:1.6;">
          {% block conteudo %}{% endblock %}
        </td></tr>
        <tr><td style="padding:16px 24px;background:#f9fafb;color:#6b7280;font-size:12px;">
          Você recebeu este e-mail porque tem uma conta na <a href="{{ site_url }}" style="color:#2D5016;">Lista de Presentes</a>.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
