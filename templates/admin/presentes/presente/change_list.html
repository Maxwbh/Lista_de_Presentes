{% extends "admin/change_list.html" %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        /* Botao no mesmo estilo dos links da barra de ferramentas do admin */
        .object-tools .botao-buscar-imagens {
            display: block; float: left; padding: 3px 12px; border: 0; border-radius: 15px;
            background: var(--object-tools-bg); color: var(--object-tools-fg);
            font-family: inherit; font-size: 0.6875rem; font-weight: 400; letter-spacing: 0.5px;
            line-height: 1rem; text-transform: uppercase; cursor: pointer;
        }
        .object-tools .botao-buscar-imagens:hover { background: var(--object-tools-hover-bg); }
        .object-tools .botao-buscar-imagens:disabled { opacity: 0.5; cursor: default; }
    </style>
{% endblock %}

{% block object-tools-items %}
    <li>
        <form method="post" action="{% url 'admin:presentes_presente_buscar_imagens' %}">
            {% csrf_token %}
            <button type="submit" class="botao-buscar-imagens"
                    title="Busca no site do link original a foto, o preço e a descrição (vazia ou genérica, como 'Pronta Entrega!') que faltam em cada presente"
                    {% if not total_incompletos %}disabled{% endif %}>
                Buscar no site o que falta ({{ total_incompletos }})
            </button>
        </form>
    </li>
    {{ block.super }}
{% endblock %}
