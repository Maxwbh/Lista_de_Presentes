# GitHub Actions: Keep Render Free Tier Alive
# Evita que o serviço desligue por inatividade (15 min) nos horários de uso.
#
# O Render Free tem limite de 750 horas de instância por mês. O ping roda
# só nas horas que tiveram acesso no relatório de 31/10/2026 (últimos 30
# dias), ~200h/mês. Horas em Brasília (UTC-3):
#   seg: 09-11h, 14h, 17h, 23h
#   ter: 09h, 11h
#   qua: 08-10h, 12-13h, 16-18h, 22h
#   qui: 00h, 07-08h, 15h, 18-20h, 23h
#   sex: 05h, 07h, 22h
#   sab: 00h, 08-09h, 13-14h, 16h, 19h, 21-23h
#   dom: 15h
# Fora dessas horas o servidor dorme e o primeiro acesso o acorda (~50s).
#
# Para revisar as horas, rode o workflow "Relatorio de Acessos"
# (relatorio-acessos.yml), que traz os acessos por hora e dia da semana.
# Próxima revisão combinada: ~30/11/2026.

name: Keep Render Alive

on:
  schedule:
    # A cada 14 minutos dentro de cada hora listada. GitHub Actions usa UTC
    # (Brasília + 3h): as horas de Brasília a partir das 21h caem no dia
    # seguinte em UTC. Formato: minuto hora dia mês dia-da-semana (0 = domingo)
    # Seg (UTC 12-14,17,20) = seg 09-11h, 14h, 17h Brasília
    - cron: '*/14 12-14,17,20 * * 1'
    # Ter (UTC 2,12,14) = seg 23h e ter 09h, 11h Brasília
    - cron: '*/14 2,12,14 * * 2'
    # Qua (UTC 11-13,15-16,19-21) = qua 08-10h, 12-13h, 16-18h Brasília
    - cron: '*/14 11-13,15-16,19-21 * * 3'
    # Qui (UTC 1,3,10-11,18,21-23) = qua 22h e qui 00h, 07-08h, 15h, 18-20h Brasília
    - cron: '*/14 1,3,10-11,18,21-23 * * 4'
    # Sex (UTC 2,8,10) = qui 23h e sex 05h, 07h Brasília
    - cron: '*/14 2,8,10 * * 5'
    # Sab (UTC 1,3,11-12,16-17,19,22) = sex 22h e sab 00h, 08-09h, 13-14h, 16h, 19h Brasília
    - cron: '*/14 1,3,11-12,16-17,19,22 * * 6'
    # Dom (UTC 0-2,18) = sab 21-23h e dom 15h Brasília
    - cron: '*/14 0-2,18 * * 0'

  # Permite executar manualmente
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Service
    runs-on: ubuntu-latest

    steps:
      - name: Ping Health Endpoint
        env:
          # Defina a variável de repositório RENDER_URL (Settings > Secrets and
          # variables > Actions > Variables) com a URL base, ex.:
          # https://lista-presentes-im4b.onrender.com
          RENDER_BASE: ${{ vars.RENDER_URL }}
        run: |
          echo "🏓 Fazendo ping no serviço Render..."
          echo "Timestamp: $(date)"

          BASE="${RENDER_BASE:-https://lista-presentes-im4b.onrender.com}"
          RENDER_URL="${BASE%/}/health/"
          echo "Pingando: $RENDER_URL"

          # Fazer request
          response=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL")

          if [ "$response" = "200" ]; then
            echo "✅ Serviço respondeu: HTTP $response"
          else
            echo "⚠️  Resposta inesperada: HTTP $response"
          fi

          echo "Próximo ping em 14 minutos..."

      - name: Log Timestamp
        run: |
          echo "Last ping: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
