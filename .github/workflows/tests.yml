name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_lista_presentes
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Create .env file
        run: |
          cat > .env << EOF
          SECRET_KEY=test-secret-key-for-ci-cd-testing-only-not-for-production
          DEBUG=True
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_lista_presentes
          ALLOWED_HOSTS=localhost,127.0.0.1
          SITE_URL=http://localhost:8000
          EOF

      - name: Create schema lista_presentes
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d test_lista_presentes -c "CREATE SCHEMA IF NOT EXISTS lista_presentes;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d test_lista_presentes -c "GRANT ALL ON SCHEMA lista_presentes TO postgres;"

      - name: Run migrations
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          coverage run manage.py test --verbosity=2
          # Piso de cobertura: a suite nao pode encolher sem alguem perceber
          coverage report --fail-under=60
          coverage html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: htmlcov/

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: flake8 (erros que quebram o codigo)
        # Falha o job: erros de sintaxe e nomes indefinidos
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: flake8 (relatorio de estilo, nao bloqueia)
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Vulnerabilidades conhecidas nas dependencias (pip-audit)
        # Falha o job se alguma dependencia tiver aviso de seguranca.
        # PYSEC-2025-183 (CVE-2025-45768, PyJWT): contestado pelo mantenedor e
        # sem versao corrigida; o tamanho da chave e responsabilidade de quem
        # chama, e o PyJWT so e usado pelo login social (desativado).
        run: |
          pip-audit -r requirements.txt --progress-spinner off --ignore-vuln PYSEC-2025-183

      - name: Analise estatica de seguranca (bandit)
        # Falha o job com achados de severidade media ou alta
        run: |
          bandit -r presentes/ lista_presentes/ -f json -o bandit-report.json || true
          bandit -r presentes/ lista_presentes/ -ll

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
